[project]
name = "storyline-translation-merge-backend"
version = "0.1.0"
description = "FastAPI backend for merging Storyline translation DOCX files."
requires-python = ">=3.10"
dependencies = [
  "fastapi[all]",
  "python-docx",
  "sqlalchemy>=2.0",
  "psycopg2-binary",
  "python-jose[cryptography]",
  "passlib[argon2]",
  "slowapi",
]
